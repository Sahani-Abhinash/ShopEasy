name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ShopEasy.slnx

      - name: Check formatting
        run: dotnet format ShopEasy.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ShopEasy.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ShopEasy.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5   # v4 runs on deprecated Node.js 20
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
